name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --baseurl "/pr-preview/pr-${{ github.event.pull_request.number }}"

      - name: Publicar preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/publish-gh-pages.sh \
            "pr-preview/pr-${{ github.event.pull_request.number }}" \
            "_site" \
            "Preview do PR #${{ github.event.pull_request.number }} (${{ github.sha }})"

      - name: Comentar link do preview no PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- gh-pages-preview-comment -->';
            const url = `https://${owner}.github.io/${repo}/pr-preview/pr-${prNumber}/`;
            const body = `${marker}\n🔍 Preview publicado: ${url}\n\nAtualizado a partir do commit ${context.payload.pull_request.head.sha}.`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

  cleanup-preview:
    name: cleanup-preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Remover preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/publish-gh-pages.sh \
            "pr-preview/pr-${{ github.event.pull_request.number }}" \
            "--delete" \
            "Limpeza do preview do PR #${{ github.event.pull_request.number }}"
