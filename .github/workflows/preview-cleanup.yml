name: Preview Cleanup

# pull_request_target (não pull_request): o Actions usa a versão deste
# arquivo que está em master, mesmo que o PR fechado tenha alterado este
# workflow — e o checkout abaixo, sem `ref:`, também baixa master, nunca o
# código do PR. Só o número do PR vem do evento; nenhum código do PR é
# executado. Ver ADR 0002, emenda.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  statuses: write

jobs:
  cleanup-preview:
    name: cleanup-preview
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Remover preview
        run: |
          .github/scripts/publish-gh-pages.sh \
            "pr-preview/pr-${{ github.event.pull_request.number }}" \
            "--delete" \
            "Limpeza do preview do PR #${{ github.event.pull_request.number }}"

      # Sem isto, o status "preview/publish" de uma publicação anterior
      # ficaria "success" mesmo com o preview já apagado — se o PR for
      # reaberto sem novo commit, o branch protection veria o check ainda
      # verde. `if: always()`: mesmo se a remoção acima falhar, não faz
      # sentido deixar um "success" para um estado que não sabemos qual é.
      - name: Invalidar status de preview no head do PR
        if: always()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state=error \
            -f context="preview/publish" \
            -f description="Preview removido (PR fechado) — reabra ou envie um commit para gerar um novo."
